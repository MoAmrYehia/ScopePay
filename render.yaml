# One-click deploy: Render dashboard → New → Blueprint → select this repository.
# Secrets marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: scopepay
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_SANDBOX_BUYER_EMAIL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: AI_DAILY_LIMIT
        value: "300"
      - key: NODE_ENV
        value: production
      # Accounts, projects and evidence files are stored in Postgres.
      - key: DATABASE_URL
        fromDatabase:
          name: scopepay-db
          property: connectionString

databases:
  # Render's free Postgres plan expires 30 days after creation; upgrade the
  # database plan in the Render dashboard to keep data longer.
  - name: scopepay-db
    plan: free
    databaseName: scopepay
    user: scopepay
