name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (mocked AI and PayPal)
        run: npm test
      - name: Install Chromium for the browser walkthrough
        run: npx playwright install --with-deps chromium
      - name: End-to-end walkthrough (demo mode)
        run: |
          npm start &
          npx --yes wait-on http://localhost:3000/api/health
          BASE_URL=http://localhost:3000 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/
